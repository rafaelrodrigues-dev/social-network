services:
  db:
    image: postgres:17
    volumes:
      - db_socialnet:/var/lib/postgresql/data
    env_file:
      - ./dotenv_files/.env
    networks:
      - socialnet-network

  web:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - media_volume:/data/web/media
      - static_volume:/data/web/static
    env_file:
      - ./dotenv_files/.env
    networks:
      - socialnet-network
    depends_on:
      - db

volumes:
  db_socialnet:
  media_volume:
  static_volume:

networks:
  socialnet-network:
